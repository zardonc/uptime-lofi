name: Deploy Self-Hosted

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: Advanced troubleshooting; leave blank for automatic default Cloudflare Pages URL
        required: false
        default: ''
      resource_prefix:
        description: Advanced troubleshooting; leave blank for automatic default resource names
        required: false
        default: ''

permissions:
  contents: read


concurrency:
  group: deploy-self-hosted
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
  INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
  PAGES_SESSION_SECRET: ${{ secrets.PAGES_SESSION_SECRET }}
  INITIAL_UI_PASSWORD: ${{ secrets.INITIAL_UI_PASSWORD }}
  SELF_HOST_PAGES_URL: ${{ inputs.pages_url }}
  RESOURCE_PREFIX: ${{ inputs.resource_prefix }}

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        run: |
          source scripts/ci/self-host-cloudflare.sh
          preflight_self_host_deploy

      - name: Provision Cloudflare resources
        id: cf
        run: |
          source scripts/ci/self-host-cloudflare.sh
          preflight_self_host_deploy
          ensure_self_host_resources

      - name: Run D1 migrations
        run: pnpm --dir backend exec wrangler --config wrangler.self-host.generated.toml d1 migrations apply ${{ steps.cf.outputs.d1_database_name }} --remote

      - name: Deploy Dashboard Worker
        working-directory: backend
        run: |
          pnpm exec wrangler deploy -c wrangler.self-host.generated.toml --minify
          printf '%s' "$API_SECRET_KEY" | pnpm exec wrangler secret put API_SECRET_KEY -c wrangler.self-host.generated.toml
          printf '%s' "$INTERNAL_API_KEY" | pnpm exec wrangler secret put INTERNAL_API_KEY -c wrangler.self-host.generated.toml

      - name: Deploy Probe Worker
        working-directory: backend
        run: |
          pnpm exec wrangler deploy -c probe-wrangler.self-host.generated.toml --minify
          printf '%s' "$API_SECRET_KEY" | pnpm exec wrangler secret put API_SECRET_KEY -c probe-wrangler.self-host.generated.toml

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: ''

      - name: Configure Pages Functions secrets
        run: |
          printf '%s' "${{ steps.cf.outputs.dashboard_worker_url }}" | pnpm --dir backend exec wrangler pages secret put BACKEND_URL --project-name=${{ steps.cf.outputs.pages_project_name }}
          printf '%s' "$INTERNAL_API_KEY" | pnpm --dir backend exec wrangler pages secret put INTERNAL_API_KEY --project-name=${{ steps.cf.outputs.pages_project_name }}
          printf '%s' "$API_SECRET_KEY" | pnpm --dir backend exec wrangler pages secret put API_SECRET_KEY --project-name=${{ steps.cf.outputs.pages_project_name }}
          printf '%s' "$PAGES_SESSION_SECRET" | pnpm --dir backend exec wrangler pages secret put PAGES_SESSION_SECRET --project-name=${{ steps.cf.outputs.pages_project_name }}
          printf '%s' "Default backend" | pnpm --dir backend exec wrangler pages secret put BACKEND_LABEL --project-name=${{ steps.cf.outputs.pages_project_name }}

      - name: Deploy Cloudflare Pages
        run: pnpm --dir backend exec wrangler pages deploy ../frontend/dist --project-name=${{ steps.cf.outputs.pages_project_name }} --branch=main --functions=../functions

      - name: Build and publish probe release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          cp scripts/install-probe.sh release-assets/install-probe.sh
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary="probe-${goos}-${goarch}"
            (cd server-probe && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags="-s -w -X main.version=probe-latest" -o "$binary" ./cmd/probe/)
            tar -czf "release-assets/${binary}.tar.gz" -C server-probe "$binary"
            rm "server-probe/${binary}"
            sha256sum "release-assets/${binary}.tar.gz" > "release-assets/${binary}.tar.gz.sha256"
          done
          (cd release-assets && cat *.sha256 > checksums.txt)
          gh release view probe-latest >/dev/null 2>&1 || gh release create probe-latest --title "Probe latest" --notes "Latest probe binaries for self-host deployments"
          gh release upload probe-latest release-assets/install-probe.sh release-assets/*.tar.gz release-assets/checksums.txt --clobber

      - name: Configure initial UI password
        if: ${{ env.INITIAL_UI_PASSWORD != '' }}
        run: |
          python -c "import json,os; print(json.dumps({'admin_key': os.environ['API_SECRET_KEY'], 'new_ui_password': os.environ['INITIAL_UI_PASSWORD']}))" > setup-payload.json
          curl --fail --silent --show-error -X POST "${API_BASE_URL}/api/auth/setup" \
            -H "Content-Type: application/json" \
            --data @setup-payload.json
        env:
          API_BASE_URL: ${{ steps.cf.outputs.dashboard_worker_url }}

      - name: Run self-host smoke validation
        run: bash scripts/smoke-test.sh --env self-host
        env:
          API_BASE_URL: ${{ steps.cf.outputs.dashboard_worker_url }}
          PROBE_BASE_URL: ${{ steps.cf.outputs.probe_worker_url }}
          PAGES_URL: ${{ steps.cf.outputs.pages_url }}
          TEST_PASSWORD: ${{ secrets.INITIAL_UI_PASSWORD }}

      - name: Deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'

          ## Deployment Complete

          Dashboard URL: ${{ steps.cf.outputs.pages_url }}

          Public Status URL: ${{ steps.cf.outputs.public_status_url }}

          Worker API URL: ${{ steps.cf.outputs.dashboard_worker_url }}

          Open the Dashboard URL, log in, then go to Monitors -> Add Monitor -> Agent Probe to generate install details.
          SUMMARY
