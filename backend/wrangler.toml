name = "uptime-lofi-backend"
main = "src/index.ts"
compatibility_date = "2026-04-01"  # Updated 2026-04-03
limits = { body_size = "1mb" }

# Production environment variables
[vars]
ENVIRONMENT = "production"

# Local testing environment overrides
[env.development.vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "uptime-lofi-db"
database_id = "PRODUCTION_DB_ID_PLACEHOLDER"

# KV namespace for instant session blacklist (logout revocation across all edge instances)
# Run: wrangler kv:namespace create SESSION_BLACKLIST
# Replace the placeholder IDs below with the actual namespace IDs from the CLI output
[[kv_namespaces]]
binding = "SESSION_BLACKLIST"
id = "PRODUCTION_KV_ID_PLACEHOLDER"
preview_id = "PRODUCTION_KV_PREVIEW_ID_PLACEHOLDER"

# Rebuildable read-model cache for v2 statistics snapshots and leaderboards.
# Run: wrangler kv:namespace create STATISTICS_CACHE
[[kv_namespaces]]
binding = "STATISTICS_CACHE"
id = "PRODUCTION_STATS_KV_ID_PLACEHOLDER"
preview_id = "PRODUCTION_STATS_KV_PREVIEW_ID_PLACEHOLDER"

# Cron Trigger for cleanup and due Agentless checks.
# Runs every 5 minutes; per-monitor SQL due filtering enforces configured intervals.
[triggers]
crons = ["*/5 * * * *"]

# ─── Staging Environment ───
[env.staging]
name = "uptime-lofi-backend-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "uptime-lofi-db-staging"
database_id = "STAGING_DB_ID_PLACEHOLDER"

[[env.staging.kv_namespaces]]
binding = "SESSION_BLACKLIST"
id = "STAGING_KV_ID_PLACEHOLDER"
preview_id = "STAGING_KV_PREVIEW_ID_PLACEHOLDER"

[[env.staging.kv_namespaces]]
binding = "STATISTICS_CACHE"
id = "STAGING_STATS_KV_ID_PLACEHOLDER"
preview_id = "STAGING_STATS_KV_PREVIEW_ID_PLACEHOLDER"

[env.staging.triggers]
crons = ["*/5 * * * *"]
